name: Build TrueNAS image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Compile production assets
        run: pnpm build

      - name: Start compiled server
        shell: bash
        run: |
          HOST=127.0.0.1 PORT=3100 node apps/server/dist/index.js > "$RUNNER_TEMP/room-riot.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/room-riot.pid"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/room-riot.log"
          exit 1

      - name: Verify compiled deployment routes
        run: pnpm verify:deployment http://127.0.0.1:3100

      - name: Stop compiled server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/room-riot.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/room-riot.pid")" 2>/dev/null || true
          fi

  publish:
    name: Publish Docker image and TrueNAS bundle
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image name
        id: image
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:main
            ${{ steps.image.outputs.repository }}:latest
            ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker run --detach --name room-riot-smoke --publish 3100:3000 "$IMAGE"
          trap 'docker rm --force room-riot-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs room-riot-smoke
          exit 1

      - name: Prepare TrueNAS deployment bundle
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          bundle_dir="$RUNNER_TEMP/room-riot-truenas"
          image="$IMAGE_REPOSITORY:sha-${GITHUB_SHA}"
          mkdir -p "$bundle_dir"

          sed "s#ghcr.io/REPLACE_WITH_OWNER/room-riot:0.1.0#$image#" \
            deploy/truenas/room-riot.compose.yaml > "$bundle_dir/room-riot.compose.yaml"
          cp deploy/truenas/README.md "$bundle_dir/README.md"
          printf '%s\n' "$image" > "$bundle_dir/image.txt"

      - name: Upload TrueNAS deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: room-riot-truenas-${{ github.sha }}
          path: ${{ runner.temp }}/room-riot-truenas
          if-no-files-found: error
