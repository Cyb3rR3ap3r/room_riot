name: Build TrueNAS image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: room-riot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate and compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@f7d0e5f4b1b3089d2799ef9722859e7ba314c4c8 # v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Run checks
        run: pnpm check

      - name: Validate game content and integration
        shell: bash
        run: |
          for game_id in groupthink hot-take suspect drawn-out blank-line wavelength; do
            python skills/room-riot-game-builder/scripts/validate_game.py \
              --repo-root . \
              --game-id "$game_id" \
              --require-integration
          done

      - name: Compile production assets
        run: pnpm build

      - name: Build container for vulnerability scan
        run: docker build --tag room-riot:ci .

      - name: Scan container for high and critical vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.1 image
          --scanners vuln
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 0
          room-riot:ci

      - name: Validate curated content and performance budgets
        run: |
          pnpm validate:content
          pnpm check:performance
          pnpm check:balance
          pnpm check:load

      - name: Start compiled server
        shell: bash
        run: |
          HOST=127.0.0.1 PORT=3100 node apps/server/dist/index.js > "$RUNNER_TEMP/room-riot.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/room-riot.pid"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/room-riot.log"
          exit 1

      - name: Verify compiled deployment routes
        run: pnpm verify:deployment http://127.0.0.1:3100

      - name: Run compiled Socket.IO smoke test
        run: pnpm smoke:compiled http://127.0.0.1:3100

      - name: Stop compiled server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/room-riot.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/room-riot.pid")" 2>/dev/null || true
          fi

  publish:
    name: Publish Docker image and TrueNAS bundle
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image name
        id: image
        shell: bash
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=release-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:main
            ${{ steps.image.outputs.repository }}:latest
            ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.release_tag }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up pnpm and Node.js for container smoke tests
        uses: pnpm/setup@f7d0e5f4b1b3089d2799ef9722859e7ba314c4c8 # v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install container smoke-test dependencies
        run: pnpm install --filter @room-riot/server... --frozen-lockfile

      - name: Smoke test published image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker run --detach --name room-riot-smoke --publish 3100:3000 "$IMAGE"
          trap 'docker rm --force room-riot-smoke >/dev/null 2>&1 || true' EXIT

          healthy=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/healthz > /dev/null; then
              healthy=true
              break
            fi
            sleep 1
          done

          if [[ "$healthy" != true ]]; then
            docker logs room-riot-smoke
            exit 1
          fi

          node scripts/verify-deployment.mjs http://127.0.0.1:3100

      - name: Scan published image for high and critical vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.1 image
          --scanners vuln
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --exit-code 0
          ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}

      - name: Prepare TrueNAS deployment bundle
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          bundle_dir="$RUNNER_TEMP/room-riot-truenas"
          image="$IMAGE_REPOSITORY:sha-${GITHUB_SHA}"
          mkdir -p "$bundle_dir"

          sed "s#ghcr.io/REPLACE_WITH_OWNER/room-riot:0.1.0#$image#" \
            deploy/truenas/room-riot.compose.yaml > "$bundle_dir/room-riot.compose.yaml"
          cp deploy/truenas/README.md "$bundle_dir/README.md"
          printf '%s\n' "$image" > "$bundle_dir/image.txt"

      - name: Upload TrueNAS deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: room-riot-truenas-${{ github.sha }}
          path: ${{ runner.temp }}/room-riot-truenas
          if-no-files-found: error
