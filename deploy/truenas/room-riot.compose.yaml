services:
  room-riot:
    image: ghcr.io/REPLACE_WITH_OWNER/room-riot:0.1.0
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      NODE_ENV: production
      # Local lab deployment: keep room state in memory and reset it on restart.
      ROOM_RIOT_DB: ''
    ports:
      - '3000:3000'
    volumes:
      - /mnt/REPLACE_WITH_POOL/room-riot:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
