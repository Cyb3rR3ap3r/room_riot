<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b16" />
    <meta
      name="description"
      content="Room Riot — a local party game for loud opinions and big laughs."
    />
    <title>Room Riot</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        background: #080b16;
        color: #f7f9ff;
        --ink: #080b16;
        --surface: rgba(17, 23, 41, 0.9);
        --line: rgba(152, 177, 220, 0.24);
        --text: #f7f9ff;
        --muted: #9aa7c4;
        --cyan: #26e6f2;
        --pink: #ff2ea6;
        --yellow: #ffd429;
        --green: #71f59a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--ink);
      }

      body {
        position: relative;
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 4% -5%, rgba(42, 230, 242, 0.2), transparent 28rem),
          radial-gradient(circle at 96% 7%, rgba(255, 46, 166, 0.18), transparent 27rem),
          linear-gradient(145deg, #090c18, #11152a 52%, #090b15);
        overscroll-behavior-y: none;
      }

      body::before {
        position: fixed;
        z-index: 0;
        inset: 0;
        content: '';
        pointer-events: none;
        opacity: 0.16;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 4rem 4rem;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      .button {
        display: inline-flex;
        min-height: 3.15rem;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: 1rem;
        padding: 0.8rem 1.25rem;
        background: linear-gradient(135deg, #57f5ff, var(--cyan));
        color: #06101a;
        cursor: pointer;
        font-weight: 900;
        letter-spacing: 0.03em;
        text-decoration: none;
        box-shadow: 0 0.75rem 1.8rem rgba(38, 230, 242, 0.16);
        touch-action: manipulation;
        transition:
          transform 160ms ease,
          filter 160ms ease,
          box-shadow 160ms ease;
      }

      button:hover,
      .button:hover {
        filter: brightness(1.08) saturate(1.1);
        transform: translateY(-2px);
        box-shadow: 0 1rem 2rem rgba(38, 230, 242, 0.24);
      }

      button:active,
      .button:active {
        transform: translateY(0);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      .button:focus-visible {
        outline: 3px solid var(--yellow);
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
        filter: grayscale(0.55);
        transform: none;
      }

      .secondary {
        border-color: rgba(38, 230, 242, 0.52);
        background: rgba(15, 22, 39, 0.82);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .secondary:hover {
        background: rgba(38, 230, 242, 0.12);
        box-shadow: 0 0.8rem 1.7rem rgba(38, 230, 242, 0.13);
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(1120px, 100%);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(4rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      }

      .display-page {
        width: min(1500px, 100%);
        padding-inline: clamp(1rem, 4vw, 4.5rem);
        background:
          linear-gradient(180deg, rgba(5, 9, 21, 0.1), rgba(5, 9, 21, 0.7)),
          url('/assets/room-riot-display-bg.png') center / cover fixed;
      }

      .page-header {
        position: relative;
        display: grid;
        gap: 0.45rem;
        margin-bottom: 1.4rem;
        padding: 0.5rem 0 1.2rem;
      }

      .page-header::after {
        width: min(23rem, 62vw);
        height: 0.2rem;
        margin-top: 0.7rem;
        content: '';
        background: linear-gradient(90deg, var(--cyan), var(--pink), transparent);
        box-shadow: 0 0 1rem rgba(38, 230, 242, 0.3);
      }

      .brand {
        width: min(18rem, 67vw);
      }

      .brand.game-brand {
        width: min(9rem, 30vw);
      }

      .brand-logo {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0.7rem 1.15rem rgba(0, 0, 0, 0.42));
      }

      .brand-logo.game-logo {
        aspect-ratio: 1;
        object-fit: contain;
      }

      h1,
      h2,
      p {
        overflow-wrap: anywhere;
      }

      h1 {
        max-width: 18ch;
        margin: 0.2rem 0;
        color: var(--text);
        font-size: clamp(2.1rem, 7vw, 4.7rem);
        line-height: 0.96;
        letter-spacing: -0.055em;
        text-wrap: balance;
        text-shadow: 0 0.35rem 1.4rem rgba(0, 0, 0, 0.35);
      }

      h2 {
        margin: 0 0 0.9rem;
        font-size: clamp(1.15rem, 2vw, 1.55rem);
        letter-spacing: -0.025em;
      }

      .muted {
        color: var(--muted);
      }

      .page-header > .muted {
        max-width: 48rem;
        margin: 0;
        color: #b4bfd6;
        font-size: clamp(0.95rem, 2vw, 1.1rem);
      }

      .notice {
        min-height: 1.4rem;
        margin: 0 0 0.9rem;
        color: var(--cyan);
        font-size: 0.9rem;
        font-weight: 800;
      }

      .notice.error {
        color: #ff92b9;
      }

      .content {
        display: grid;
        gap: 1rem;
      }

      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 1.4rem;
        padding: clamp(1rem, 2.5vw, 1.5rem);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.045), transparent 38%), var(--surface);
        box-shadow:
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.23),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(14px);
      }

      .card::after {
        position: absolute;
        top: -5rem;
        right: -4rem;
        width: 12rem;
        height: 12rem;
        border-radius: 50%;
        content: '';
        background: rgba(38, 230, 242, 0.06);
        filter: blur(1rem);
        pointer-events: none;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .phase-card {
        animation: phase-in 240ms ease-out both;
      }

      .phase-lobby {
        border-color: rgba(38, 230, 242, 0.45);
      }

      .phase-input {
        border-color: rgba(38, 230, 242, 0.65);
        box-shadow:
          0 0 2.2rem rgba(38, 230, 242, 0.1),
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.23);
      }

      .phase-voting {
        border-color: rgba(255, 46, 166, 0.72);
        box-shadow:
          0 0 2.2rem rgba(255, 46, 166, 0.1),
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.23);
      }

      .phase-results,
      .phase-winner {
        border-color: rgba(255, 212, 41, 0.7);
        box-shadow:
          0 0 2.2rem rgba(255, 212, 41, 0.1),
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.23);
      }

      @keyframes phase-in {
        from {
          opacity: 0;
          transform: translateY(0.5rem) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .game-groupthink {
        --game-accent: #29e9f4;
        --game-accent-strong: #2374ff;
        --game-glow: rgba(41, 233, 244, 0.2);
        --game-surface: rgba(10, 54, 91, 0.66);
      }

      .game-hot-take {
        --game-accent: #ff3ea9;
        --game-accent-strong: #9d46ff;
        --game-glow: rgba(255, 62, 169, 0.2);
        --game-surface: rgba(84, 21, 86, 0.66);
      }

      .game-suspect {
        --game-accent: #ffb31a;
        --game-accent-strong: #ff3d7f;
        --game-glow: rgba(255, 61, 127, 0.2);
        --game-surface: rgba(46, 19, 48, 0.72);
      }

      .page.game-groupthink,
      .page.game-hot-take,
      .page.game-suspect {
        background:
          radial-gradient(circle at 100% 0, var(--game-glow), transparent 28rem),
          radial-gradient(circle at 0 100%, var(--game-glow), transparent 24rem);
      }

      .page.game-groupthink .phase-card,
      .game-detail.game-groupthink {
        border-color: color-mix(in srgb, var(--game-accent) 65%, transparent);
        background:
          linear-gradient(135deg, rgba(41, 233, 244, 0.13), transparent 48%), var(--surface);
      }

      .page.game-hot-take .phase-card,
      .game-detail.game-hot-take,
      .page.game-suspect .phase-card,
      .game-detail.game-suspect {
        border-color: color-mix(in srgb, var(--game-accent) 65%, transparent);
        background:
          linear-gradient(135deg, rgba(255, 62, 169, 0.14), transparent 48%), var(--surface);
      }

      .game-launcher {
        width: 100%;
        max-width: 56rem;
        gap: 1.25rem;
      }

      .game-picker {
        display: grid;
        gap: 1rem;
      }

      .game-picker-heading h2 {
        margin-bottom: 0.3rem;
      }

      .game-picker-heading p {
        margin: 0;
      }

      .game-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.8rem;
      }

      .game-option {
        display: grid;
        min-height: 10rem;
        grid-template-columns: 5.8rem minmax(0, 1fr);
        align-items: center;
        justify-content: start;
        gap: 0.8rem;
        border: 1px solid rgba(152, 177, 220, 0.24);
        border-radius: 1.25rem;
        padding: 0.75rem;
        background: rgba(5, 10, 23, 0.6);
        color: var(--text);
        text-align: left;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
      }

      .game-option:hover {
        border-color: color-mix(in srgb, var(--game-accent) 75%, transparent);
        background: var(--game-surface);
        box-shadow: 0 0.9rem 2rem var(--game-glow);
      }

      .game-option[aria-pressed='true'] {
        border-color: var(--game-accent);
        background: var(--game-surface);
        box-shadow:
          0 0 0 2px color-mix(in srgb, var(--game-accent) 30%, transparent),
          0 1rem 2.4rem var(--game-glow);
      }

      .game-option-copy {
        display: grid;
        gap: 0.2rem;
        min-width: 0;
      }

      .game-option-copy strong {
        font-size: 1.15rem;
      }

      .game-option-copy span {
        color: var(--game-accent);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .game-detail {
        display: grid;
        grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr);
        align-items: center;
        gap: 1rem 1.2rem;
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        padding: 1rem;
      }

      .game-detail-copy {
        min-width: 0;
      }

      .game-detail-copy h3 {
        margin: 0.2rem 0 0.35rem;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        letter-spacing: -0.045em;
      }

      .game-detail-copy p {
        max-width: 42rem;
        margin: 0 0 0.8rem;
        color: #c0cbe1;
        line-height: 1.45;
      }

      .game-facts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .game-facts li {
        border: 1px solid color-mix(in srgb, var(--game-accent) 42%, transparent);
        border-radius: 999px;
        padding: 0.35rem 0.65rem;
        background: color-mix(in srgb, var(--game-accent) 10%, transparent);
        color: var(--game-accent);
        font-size: 0.75rem;
        font-weight: 900;
      }

      .game-art {
        display: block;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 0.7rem 0.8rem rgba(0, 0, 0, 0.32));
      }

      .game-art-option {
        width: 5.5rem;
      }

      .game-art-large {
        width: min(100%, 12rem);
        justify-self: center;
      }

      .game-art-small {
        width: 4.8rem;
        flex: 0 0 4.8rem;
      }

      .game-identity {
        display: flex;
        width: min(100%, 34rem);
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.7rem;
        text-align: left;
      }

      .game-identity-copy {
        display: grid;
        gap: 0.12rem;
        min-width: 0;
      }

      .game-identity-copy strong {
        color: var(--game-accent);
        font-size: clamp(1.2rem, 3vw, 1.8rem);
        line-height: 1;
      }

      .game-kicker {
        color: var(--game-accent);
        font-size: 0.7rem;
        font-weight: 950;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .game-launcher-actions {
        justify-content: flex-end;
        border-top: 1px solid rgba(152, 177, 220, 0.16);
        padding-top: 1rem;
      }

      .create-game-button {
        min-width: 12rem;
        background: linear-gradient(135deg, #fff047, #ffb516 52%, #ff5a87);
        box-shadow: 0 0.75rem 1.8rem rgba(255, 180, 22, 0.2);
      }

      .create-game-button:hover {
        box-shadow: 0 1rem 2rem rgba(255, 180, 22, 0.3);
      }

      .form {
        display: grid;
        gap: 1rem;
        max-width: 38rem;
      }

      .field {
        display: grid;
        gap: 0.45rem;
        color: #c3cde1;
        font-size: 0.86rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      input,
      select {
        width: 100%;
        min-height: 3.15rem;
        border: 1px solid rgba(152, 177, 220, 0.35);
        border-radius: 0.9rem;
        padding: 0.8rem 0.95rem;
        background: rgba(5, 10, 23, 0.75);
        color: var(--text);
        outline: none;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      input:hover,
      select:hover,
      input:focus,
      select:focus {
        border-color: rgba(38, 230, 242, 0.78);
        background: rgba(7, 16, 32, 0.92);
        box-shadow: 0 0 0 3px rgba(38, 230, 242, 0.1);
      }

      input::placeholder {
        color: #6e7b99;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        align-items: center;
      }

      .room-details {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.8rem 1.25rem;
        align-items: center;
        background:
          linear-gradient(135deg, rgba(38, 230, 242, 0.12), transparent 48%), var(--surface);
      }

      .room-details .room-code {
        grid-column: 1;
        grid-row: 1;
      }

      .room-details .qr {
        grid-column: 2;
        grid-row: 1 / span 2;
      }

      .room-details p {
        grid-column: 1;
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .room-code {
        display: block;
        color: var(--yellow);
        font-size: clamp(3.2rem, 12vw, 8rem);
        font-weight: 950;
        letter-spacing: 0.11em;
        line-height: 0.9;
        text-shadow:
          0 0 1.6rem rgba(255, 212, 41, 0.25),
          0.12rem 0.16rem 0 #7f5300;
      }

      .qr {
        width: min(13rem, 30vw);
        border: 0.45rem solid #fff;
        border-radius: 1rem;
        background: #fff;
        padding: 0.35rem;
        box-shadow: 0 0.9rem 2rem rgba(0, 0, 0, 0.3);
      }

      .prompt {
        margin: 0.8rem 0 1.1rem;
        color: var(--text);
        font-size: clamp(1.6rem, 4.2vw, 3.9rem);
        font-weight: 950;
        line-height: 1.04;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }

      .answer-form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.1rem;
      }

      .answer-form .field {
        flex: 1 1 18rem;
      }

      .answer-form input,
      .answer-form select {
        min-height: 3.5rem;
      }

      .answer-form button {
        align-self: end;
      }

      .player-list,
      .answer-list {
        display: grid;
        gap: 0.55rem;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .player-list li,
      .answer-list li {
        display: flex;
        min-height: 3rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border: 1px solid rgba(152, 177, 220, 0.13);
        border-radius: 0.9rem;
        padding: 0.7rem 0.85rem;
        background: rgba(4, 9, 22, 0.45);
      }

      .answer-list li {
        align-items: flex-start;
      }

      .answer-list li > span:first-child {
        font-weight: 800;
      }

      .connected {
        color: var(--green);
        font-weight: 900;
      }

      .pill {
        display: inline-flex;
        min-height: 2rem;
        align-items: center;
        border: 1px solid rgba(38, 230, 242, 0.4);
        border-radius: 999px;
        padding: 0.4rem 0.8rem;
        background: rgba(38, 230, 242, 0.11);
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.06em;
      }

      .scoreboard li strong {
        color: var(--yellow);
        font-size: 1.25rem;
      }

      .center {
        text-align: center;
        justify-items: center;
      }

      .center .qr {
        width: min(16rem, 60vw);
      }

      .display-page .page-header {
        max-width: 58rem;
        margin-inline: auto;
        text-align: center;
        justify-items: center;
      }

      .display-page .page-header::after {
        background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
      }

      .display-page .brand {
        width: min(23rem, 60vw);
      }

      .display-page .brand.game-brand {
        width: min(11rem, 28vw);
      }

      .display-page .content {
        grid-template-columns: minmax(0, 1.35fr) minmax(18rem, 0.65fr);
        align-items: start;
      }

      .display-page .content > :first-child,
      .display-page .content > :nth-child(2) {
        grid-column: 1;
      }

      .display-page .content > :last-child {
        grid-column: 2;
        grid-row: 1 / span 2;
      }

      .display-page .content > .phase-card:first-child {
        min-height: 31rem;
        display: grid;
        align-content: center;
      }

      .display-page .prompt {
        font-size: clamp(2.1rem, 5vw, 5.5rem);
      }

      .display-page .player-list {
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      }

      @media (min-width: 720px) {
        .room-details .room-code {
          font-size: clamp(4.2rem, 10vw, 7rem);
        }
      }

      @media (max-width: 900px) {
        .display-page .content {
          grid-template-columns: 1fr;
        }

        .display-page .content > :first-child,
        .display-page .content > :nth-child(2),
        .display-page .content > :last-child {
          grid-column: 1;
          grid-row: auto;
        }
      }

      @media (max-width: 600px) {
        .page {
          padding-top: max(1rem, env(safe-area-inset-top));
        }

        .page-header {
          margin-bottom: 1rem;
        }

        .brand {
          width: min(13rem, 70vw);
        }

        .game-options,
        .game-detail {
          grid-template-columns: 1fr;
        }

        .game-option {
          min-height: 7.5rem;
        }

        .game-art-large {
          width: min(10rem, 50vw);
        }

        .game-launcher-actions > button {
          width: 100%;
        }

        .room-details {
          grid-template-columns: 1fr;
        }

        .room-details .room-code,
        .room-details .qr,
        .room-details p {
          grid-column: 1;
          grid-row: auto;
        }

        .room-details .qr {
          width: min(13rem, 65vw);
        }

        .actions > button,
        .actions > .button {
          flex: 1 1 100%;
          text-align: center;
        }

        .answer-form {
          flex-direction: column;
        }

        .answer-form button {
          width: 100%;
        }

        .player-list li,
        .answer-list li {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.3rem;
        }

        .display-page .content > .phase-card:first-child {
          min-height: 25rem;
        }
      }

      /* Game experiences -------------------------------------------------- */
      .page[data-game-id] {
        width: 100%;
        max-width: none;
        padding: clamp(0.75rem, 1.6vw, 1.5rem);
      }

      .page[data-game-id] > .page-header {
        display: none;
      }

      .page[data-game-id] > .notice {
        position: fixed;
        z-index: 30;
        top: 0.75rem;
        left: 50%;
        width: max-content;
        max-width: calc(100vw - 2rem);
        margin: 0;
        transform: translateX(-50%);
      }

      .page[data-game-id] > .notice:empty {
        display: none;
      }

      .page[data-game-id] > .content {
        display: block;
      }

      .page.game-groupthink {
        --game-primary: #23edf2;
        --game-secondary: #4a8cff;
        --game-accent: #ffe12f;
        --game-panel: rgba(5, 25, 53, 0.88);
        background:
          linear-gradient(120deg, rgba(2, 10, 30, 0.7), rgba(2, 14, 35, 0.34)),
          url('/assets/groupthink-lab-bg-v2.png') center / cover fixed;
      }

      .page.game-hot-take {
        --game-primary: #ff2da7;
        --game-secondary: #8c3eff;
        --game-accent: #ffb51e;
        --game-panel: rgba(27, 4, 40, 0.9);
        background:
          linear-gradient(120deg, rgba(10, 2, 19, 0.66), rgba(25, 0, 28, 0.4)),
          url('/assets/hot-take-stage-bg-v2.png') center / cover fixed;
      }

      .page.game-suspect {
        --game-primary: #ff3d7f;
        --game-secondary: #6d4aff;
        --game-accent: #ffb31a;
        --game-panel: rgba(18, 12, 34, 0.92);
        background:
          linear-gradient(120deg, rgba(4, 7, 24, 0.72), rgba(24, 5, 28, 0.42)),
          url('/assets/suspect-bg-v2.png') center / cover fixed;
      }

      .experience-shell {
        position: relative;
        min-height: calc(100svh - 3rem);
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--game-primary) 42%, transparent);
        background: rgba(3, 9, 25, 0.72);
        box-shadow:
          0 2rem 6rem rgba(0, 0, 0, 0.55),
          inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(18px) saturate(1.16);
      }

      .consensus-lab {
        border-radius: 2rem;
        background:
          radial-gradient(circle at 50% 50%, rgba(35, 237, 242, 0.1), transparent 40%),
          linear-gradient(150deg, rgba(4, 20, 50, 0.92), rgba(2, 10, 28, 0.86));
      }

      .live-heat {
        border-color: rgba(255, 45, 167, 0.5);
        border-radius: 0.6rem;
        clip-path: polygon(0 0, 96% 0, 100% 3.5rem, 100% 100%, 3% 100%, 0 calc(100% - 2rem));
        background:
          radial-gradient(circle at 50% 120%, rgba(255, 76, 29, 0.2), transparent 42%),
          linear-gradient(145deg, rgba(24, 3, 42, 0.94), rgba(8, 3, 21, 0.9));
      }

      .case-room {
        border-color: rgba(255, 61, 127, 0.55);
        border-radius: 1rem;
        background:
          radial-gradient(circle at 55% 20%, rgba(255, 179, 26, 0.1), transparent 38%),
          linear-gradient(150deg, rgba(24, 10, 39, 0.95), rgba(5, 8, 25, 0.92));
      }

      .case-room .experience-topbar {
        border-bottom-color: rgba(255, 179, 26, 0.32);
      }

      .experience-topbar {
        position: relative;
        z-index: 4;
        display: flex;
        min-height: 5.5rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid color-mix(in srgb, var(--game-primary) 25%, transparent);
        padding: 0.65rem clamp(1rem, 2vw, 2rem);
        background: rgba(3, 8, 23, 0.76);
      }

      .consensus-lab .experience-topbar {
        border-radius: 2rem 2rem 0 0;
      }

      .live-heat .experience-topbar::after {
        position: absolute;
        right: 0;
        bottom: -0.2rem;
        width: 42%;
        height: 0.28rem;
        content: '';
        background: linear-gradient(90deg, transparent, var(--game-primary), var(--game-accent));
        box-shadow: 0 0 1.2rem var(--game-primary);
      }

      .experience-title,
      .experience-live-status {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }

      .experience-title > div {
        display: grid;
      }

      .experience-logo {
        width: 4.35rem;
        height: 4.35rem;
        object-fit: contain;
        filter: drop-shadow(0 0.6rem 0.8rem rgba(0, 0, 0, 0.5));
      }

      .experience-title strong {
        font:
          900 clamp(1.35rem, 2.5vw, 2.2rem) / 1 'Arial Black',
          'Trebuchet MS',
          sans-serif;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }

      .experience-eyebrow {
        color: var(--game-primary);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .experience-live-status {
        border: 1px solid color-mix(in srgb, var(--game-primary) 35%, transparent);
        border-radius: 999px;
        padding: 0.55rem 0.85rem;
        background: rgba(2, 7, 19, 0.8);
        text-transform: uppercase;
      }

      .live-heat .experience-live-status {
        border-radius: 0.25rem;
        transform: skew(-4deg);
      }

      .experience-live-status > span {
        width: 0.62rem;
        height: 0.62rem;
        border-radius: 50%;
        background: var(--game-primary);
        box-shadow: 0 0 0.8rem var(--game-primary);
        animation: experience-pulse 1.8s ease-in-out infinite;
      }

      .experience-live-status strong {
        font-size: 0.78rem;
        letter-spacing: 0.09em;
      }

      .experience-live-status small {
        color: var(--muted);
        font-weight: 800;
      }

      .experience-grid {
        display: grid;
        min-height: calc(100svh - 8.5rem);
        grid-template-columns: minmax(13rem, 0.78fr) minmax(28rem, 2.25fr) minmax(15rem, 0.9fr);
        gap: clamp(0.7rem, 1.4vw, 1.25rem);
        padding: clamp(0.8rem, 1.5vw, 1.4rem);
      }

      .lab-room-pass,
      .mind-roster,
      .audience-roster,
      .jury-roster,
      .consensus-stage,
      .heat-room-pass,
      .heat-stage,
      .suspect-room-pass,
      .suspect-stage {
        position: relative;
        min-width: 0;
        overflow: hidden;
      }

      .lab-room-pass,
      .mind-roster,
      .consensus-stage {
        border: 1px solid rgba(35, 237, 242, 0.28);
        border-radius: 1.6rem;
        background: linear-gradient(145deg, rgba(10, 33, 67, 0.9), rgba(4, 16, 41, 0.84));
        box-shadow: inset 0 0 2rem rgba(35, 237, 242, 0.045);
      }

      .heat-room-pass,
      .audience-roster,
      .heat-stage {
        border: 1px solid rgba(255, 45, 167, 0.33);
        border-radius: 0.45rem;
        background: linear-gradient(150deg, rgba(44, 8, 63, 0.92), rgba(14, 3, 29, 0.88));
        box-shadow: inset 0 0 2.5rem rgba(255, 45, 167, 0.055);
      }

      .suspect-room-pass,
      .jury-roster,
      .suspect-stage {
        border: 1px solid rgba(255, 61, 127, 0.36);
        border-radius: 0.8rem;
        background:
          linear-gradient(145deg, rgba(44, 17, 48, 0.92), rgba(9, 10, 29, 0.9)),
          url('/assets/suspect-bg-v2.png') center / cover;
        box-shadow: inset 0 0 2.5rem rgba(255, 179, 26, 0.055);
      }

      .lab-room-pass,
      .heat-room-pass,
      .suspect-room-pass {
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        gap: 0.55rem;
        padding: 1.1rem;
        text-align: center;
      }

      .heat-room-pass {
        clip-path: polygon(
          0.7rem 0,
          100% 0,
          100% calc(100% - 0.8rem),
          calc(100% - 0.8rem) 100%,
          0 100%,
          0 0.7rem
        );
      }

      .suspect-room-pass {
        border-color: rgba(255, 179, 26, 0.42);
      }

      .room-pass-label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .join-address {
        max-width: 100%;
        overflow: hidden;
        color: white;
        font-size: clamp(0.72rem, 1.2vw, 1rem);
        text-overflow: ellipsis;
      }

      .lab-room-pass .room-code,
      .heat-room-pass .room-code,
      .suspect-room-pass .room-code {
        margin: 0.35rem 0;
        color: white;
        font:
          900 clamp(2.7rem, 5vw, 5.4rem) / 0.9 'Arial Black',
          sans-serif;
        letter-spacing: 0.08em;
        text-shadow: 0 0 1.3rem var(--game-primary);
      }

      .heat-room-pass .room-code {
        color: var(--game-accent);
        font-style: italic;
        transform: skew(-5deg);
      }

      .suspect-room-pass .room-code {
        color: var(--game-accent);
        text-shadow: 0 0 1.3rem rgba(255, 179, 26, 0.6);
      }

      .lab-room-pass .qr,
      .heat-room-pass .qr,
      .suspect-room-pass .qr {
        width: min(10rem, 78%);
        border: 0.45rem solid white;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 0 1.6rem color-mix(in srgb, var(--game-primary) 35%, transparent);
      }

      .heat-room-pass .qr {
        border-color: var(--game-accent);
        border-radius: 0.25rem;
        transform: rotate(-1.5deg);
      }

      .suspect-room-pass .qr {
        border-color: var(--game-accent);
        border-radius: 0.35rem;
      }

      .consensus-stage,
      .heat-stage,
      .suspect-stage {
        display: grid;
        grid-template-rows: minmax(10rem, 0.85fr) minmax(12rem, 1.15fr);
      }

      .stage-art-wrap {
        position: relative;
        display: grid;
        min-height: 0;
        place-items: center;
        overflow: hidden;
      }

      .stage-art-wrap::after {
        position: absolute;
        inset: auto 10% 0;
        height: 3rem;
        content: '';
        border-radius: 50%;
        background: var(--game-primary);
        opacity: 0.2;
        filter: blur(1.8rem);
      }

      .stage-art {
        position: relative;
        z-index: 1;
        width: min(92%, 34rem);
        height: 100%;
        min-height: 9rem;
        object-fit: contain;
        filter: drop-shadow(0 1rem 1.4rem rgba(0, 0, 0, 0.45));
      }

      .consensus-stage .stage-art {
        animation: reactor-float 4.5s ease-in-out infinite;
      }

      .heat-stage .stage-art {
        width: min(95%, 38rem);
        animation: stage-breathe 2.7s ease-in-out infinite;
      }

      .suspect-stage .stage-art {
        width: min(98%, 40rem);
        animation: case-breathe 4s ease-in-out infinite;
      }

      .stage-copy {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: stretch;
        flex-direction: column;
        justify-content: center;
        gap: 0.8rem;
        padding: clamp(1rem, 2.2vw, 2.1rem);
        background: linear-gradient(180deg, transparent, rgba(2, 7, 20, 0.88) 18%);
      }

      .stage-copy h2 {
        margin: 0;
        font:
          900 clamp(1.5rem, 2.7vw, 3rem) / 1.08 'Arial Black',
          'Trebuchet MS',
          sans-serif;
        letter-spacing: -0.035em;
      }

      .heat-stage .stage-copy h2 {
        color: white;
        font-style: italic;
        text-transform: uppercase;
        text-shadow: 0.18rem 0.18rem 0 #781bd0;
      }

      .suspect-stage .stage-copy h2 {
        color: #fff3d0;
        text-shadow: 0.12rem 0.12rem 0 rgba(255, 61, 127, 0.62);
      }

      .experience-meter {
        display: grid;
        gap: 0.45rem;
      }

      .experience-meter > div:first-child {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .experience-meter-track {
        height: 0.75rem;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--game-primary) 30%, transparent);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.38);
      }

      .live-heat .experience-meter-track {
        border-radius: 0.15rem;
        transform: skew(-7deg);
      }

      .experience-meter-track > span {
        display: block;
        height: 100%;
        min-width: 0.3rem;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          var(--game-secondary),
          var(--game-primary),
          var(--game-accent)
        );
        box-shadow: 0 0 1rem var(--game-primary);
        transition: width 350ms ease;
      }

      .mind-roster,
      .audience-roster,
      .jury-roster {
        padding: 1rem;
      }

      .experience-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 0.8rem;
      }

      .experience-section-title h2 {
        margin: 0;
        font-size: 1.08rem;
        text-transform: uppercase;
      }

      .experience-section-title span {
        color: var(--game-primary);
        font-weight: 900;
      }

      .mind-grid,
      .audience-grid,
      .jury-grid {
        display: grid;
        gap: 0.55rem;
        margin: 0;
        padding: 0.8rem 0 0;
        list-style: none;
      }

      .mind-grid li,
      .audience-grid li,
      .jury-grid li {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.65rem;
        padding: 0.58rem;
      }

      .mind-grid li {
        border: 1px solid rgba(35, 237, 242, 0.2);
        border-radius: 999px;
        background: rgba(16, 56, 88, 0.48);
      }

      .audience-grid li {
        position: relative;
        border-left: 0.22rem solid var(--game-primary);
        background: linear-gradient(90deg, rgba(255, 45, 167, 0.14), transparent);
      }

      .jury-grid li {
        border: 1px solid rgba(255, 179, 26, 0.24);
        border-radius: 0.35rem;
        background: linear-gradient(90deg, rgba(255, 61, 127, 0.15), transparent);
      }

      .roster-avatar {
        display: grid;
        width: 2.5rem;
        height: 2.5rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: color-mix(in srgb, var(--game-primary) 17%, #11182c);
        font-size: 1.35rem;
        place-items: center;
      }

      .mind-grid li > span:last-child,
      .audience-grid li > span:last-child,
      .jury-grid li > span:last-child {
        display: grid;
        min-width: 0;
      }

      .mind-grid strong,
      .audience-grid strong,
      .jury-grid strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mind-grid small,
      .audience-grid small,
      .jury-grid small {
        color: var(--muted);
      }

      .thought-clusters .answer-list,
      .take-wall .answer-list,
      .suspect-results .answer-list {
        grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
      }

      .thought-clusters .answer-list li {
        border-color: rgba(35, 237, 242, 0.35);
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(35, 237, 242, 0.18), rgba(49, 94, 190, 0.14));
      }

      .take-wall .answer-list li {
        border-color: rgba(255, 45, 167, 0.38);
        border-radius: 0.25rem;
        background: linear-gradient(135deg, rgba(255, 45, 167, 0.18), rgba(113, 22, 168, 0.16));
        clip-path: polygon(
          0.4rem 0,
          100% 0,
          100% calc(100% - 0.4rem),
          calc(100% - 0.4rem) 100%,
          0 100%,
          0 0.4rem
        );
      }

      .suspect-callout,
      .suspect-result-callout {
        border: 1px solid rgba(255, 179, 26, 0.42);
        border-radius: 0.45rem;
        padding: 0.75rem 0.9rem;
        background: rgba(255, 179, 26, 0.1);
        color: #fff3d0;
        font-weight: 800;
      }

      .suspect-vote-summary li {
        border-color: rgba(255, 61, 127, 0.28);
      }

      .thought-clusters h2,
      .take-wall h2,
      .experience-scoreboard h2 {
        margin: 0 0 0.65rem;
        color: var(--game-primary);
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .experience-controls {
        position: fixed;
        z-index: 20;
        right: 50%;
        bottom: max(1rem, env(safe-area-inset-bottom));
        width: min(72rem, calc(100% - 2rem));
        justify-content: center;
        border: 1px solid color-mix(in srgb, var(--game-primary) 35%, transparent);
        border-radius: 999px;
        padding: 0.6rem;
        background: rgba(3, 7, 19, 0.92);
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.55);
        transform: translateX(50%);
        backdrop-filter: blur(18px);
      }

      .heat-controls {
        border-radius: 0.35rem;
        clip-path: polygon(0.8rem 0, 100% 0, calc(100% - 0.8rem) 100%, 0 100%);
      }

      .heat-controls button:not(.secondary),
      .live-heat-controller button:not(.secondary) {
        border-radius: 0.25rem;
        background: linear-gradient(135deg, var(--game-accent), #ff4b1f 45%, var(--game-primary));
        clip-path: polygon(0.5rem 0, 100% 0, calc(100% - 0.5rem) 100%, 0 100%);
      }

      .display-experience {
        min-height: calc(100svh - 1.5rem);
      }

      .display-experience .experience-grid {
        min-height: calc(100svh - 7.5rem);
      }

      .display-audio-control {
        margin-top: 0.35rem;
      }

      .display-audio-control button {
        min-height: 2.5rem;
        padding: 0.55rem 0.75rem;
        font-size: 0.72rem;
      }

      /* Game-specific join screens */
      .themed-join-card {
        display: grid;
        width: min(34rem, 100%);
        gap: 1rem;
        margin: clamp(1rem, 6vh, 4.5rem) auto;
        border: 1px solid color-mix(in srgb, var(--game-primary) 45%, transparent);
        padding: clamp(1rem, 4vw, 2rem);
        background: rgba(3, 10, 27, 0.94);
        box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.58);
        backdrop-filter: blur(18px) saturate(1.2);
      }

      .join-groupthink {
        border-radius: 2rem;
        background:
          radial-gradient(circle at 50% 8%, rgba(35, 237, 242, 0.2), transparent 35%),
          linear-gradient(155deg, rgba(9, 38, 75, 0.97), rgba(2, 12, 32, 0.98));
      }

      .join-hot-take {
        border-radius: 0.45rem;
        clip-path: polygon(
          0 0,
          calc(100% - 1.2rem) 0,
          100% 1.2rem,
          100% 100%,
          1rem 100%,
          0 calc(100% - 1rem)
        );
        background:
          radial-gradient(circle at 50% 110%, rgba(255, 91, 24, 0.28), transparent 38%),
          linear-gradient(150deg, rgba(55, 8, 73, 0.98), rgba(15, 3, 30, 0.98));
      }

      .join-suspect {
        border-radius: 0.8rem;
        background:
          radial-gradient(circle at 50% 8%, rgba(255, 179, 26, 0.14), transparent 35%),
          linear-gradient(155deg, rgba(35, 14, 46, 0.98), rgba(5, 8, 25, 0.98));
      }

      .themed-join-intro {
        display: grid;
        align-items: center;
        grid-template-columns: 8.5rem 1fr;
        gap: 1rem;
        border-bottom: 1px solid color-mix(in srgb, var(--game-primary) 24%, transparent);
        padding-bottom: 1rem;
      }

      .themed-join-logo {
        width: 8.5rem;
        height: 8.5rem;
        object-fit: contain;
        filter: drop-shadow(0 0.8rem 1rem rgba(0, 0, 0, 0.5));
      }

      .themed-join-intro h1 {
        margin: 0.25rem 0;
        font:
          900 clamp(1.7rem, 7vw, 2.5rem) / 1 'Arial Black',
          'Trebuchet MS',
          sans-serif;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }

      .join-hot-take .themed-join-intro h1 {
        color: white;
        font-style: italic;
        text-shadow: 0.16rem 0.16rem 0 #781bd0;
      }

      .themed-join-intro p {
        margin: 0;
        line-height: 1.35;
      }

      .themed-join-card .field {
        gap: 0.45rem;
      }

      .themed-join-card .field > span {
        color: var(--game-primary);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .join-groupthink input,
      .join-groupthink select {
        border-radius: 999px;
      }

      .join-groupthink button {
        border-radius: 999px;
        background: linear-gradient(135deg, #45f7ff, #27d8ef);
      }

      .join-hot-take input,
      .join-hot-take select {
        border-radius: 0.2rem;
        border-color: rgba(255, 45, 167, 0.5);
      }

      .join-hot-take button {
        border-radius: 0.2rem;
        background: linear-gradient(135deg, var(--game-accent), #ff511f 46%, var(--game-primary));
        clip-path: polygon(0.5rem 0, 100% 0, calc(100% - 0.5rem) 100%, 0 100%);
      }

      .join-suspect input,
      .join-suspect select {
        border-color: rgba(255, 179, 26, 0.5);
        border-radius: 0.35rem;
      }

      .join-suspect button {
        border-radius: 0.35rem;
        background: linear-gradient(135deg, var(--game-accent), var(--game-primary));
        color: #1b0820;
      }

      /* Phone controllers */
      .player-page[data-game-id] {
        display: grid;
        min-height: 100svh;
        place-items: start center;
      }

      .player-page[data-game-id] > .content {
        width: min(34rem, 100%);
      }

      .controller-shell {
        position: relative;
        display: flex;
        min-height: calc(100svh - 8rem);
        overflow: hidden;
        align-items: stretch;
        flex-direction: column;
        gap: 1rem;
        padding: 0 1.1rem 1.4rem;
        background: rgba(3, 10, 25, 0.92);
        box-shadow: 0 1.8rem 5rem rgba(0, 0, 0, 0.55);
      }

      .consensus-controller {
        border: 1px solid rgba(35, 237, 242, 0.4);
        border-radius: 2rem;
        background:
          radial-gradient(circle at 50% 14%, rgba(35, 237, 242, 0.18), transparent 30%),
          linear-gradient(160deg, rgba(8, 35, 69, 0.96), rgba(2, 11, 31, 0.98));
      }

      .live-heat-controller {
        border: 1px solid rgba(255, 45, 167, 0.48);
        border-radius: 0.6rem;
        clip-path: polygon(
          0 0,
          calc(100% - 1.3rem) 0,
          100% 1.3rem,
          100% 100%,
          1rem 100%,
          0 calc(100% - 1rem)
        );
        background:
          radial-gradient(circle at 50% 115%, rgba(255, 75, 24, 0.3), transparent 42%),
          linear-gradient(155deg, rgba(48, 8, 66, 0.97), rgba(13, 3, 27, 0.98));
      }

      .suspect-controller {
        border: 1px solid rgba(255, 61, 127, 0.48);
        border-radius: 0.8rem;
        background:
          radial-gradient(circle at 50% 14%, rgba(255, 179, 26, 0.16), transparent 30%),
          linear-gradient(160deg, rgba(35, 14, 46, 0.97), rgba(5, 8, 25, 0.98));
      }

      .controller-topbar {
        min-height: 4.6rem;
        margin-inline: -1.1rem;
        padding-inline: 1rem;
      }

      .controller-topbar .experience-logo {
        width: 3.5rem;
        height: 3.5rem;
      }

      .controller-topbar .experience-title strong {
        font-size: 1.25rem;
      }

      .controller-topbar .experience-live-status small,
      .controller-topbar .experience-live-status strong {
        display: none;
      }

      .controller-art {
        width: min(13rem, 58vw);
        height: 10rem;
        margin: 0 auto -1.5rem;
      }

      .controller-shell > h2 {
        margin: 0;
        text-align: center;
      }

      .controller-shell .prompt {
        margin: 0;
        border: 1px solid color-mix(in srgb, var(--game-primary) 35%, transparent);
        padding: 1rem;
        background: rgba(0, 0, 0, 0.22);
        font-size: clamp(1.25rem, 6vw, 1.8rem);
        line-height: 1.15;
        text-align: center;
      }

      .consensus-controller .prompt {
        border-radius: 1.5rem;
      }

      .live-heat-controller .prompt {
        border-radius: 0.2rem;
        font-style: italic;
        text-transform: uppercase;
        transform: rotate(-0.5deg);
      }

      .suspect-controller .prompt {
        border-color: rgba(255, 179, 26, 0.38);
        border-radius: 0.45rem;
      }

      .suspect-answer-form select,
      .suspect-alibi-form textarea,
      .suspect-vote-form select {
        border-color: rgba(255, 179, 26, 0.5);
        border-radius: 0.35rem;
      }

      .suspect-controller button:not(.secondary) {
        border-radius: 0.35rem;
        background: linear-gradient(135deg, var(--game-accent), var(--game-primary));
        color: #1b0820;
      }

      .checkbox-field {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .checkbox-field input {
        width: 1rem;
        height: 1rem;
      }

      .controller-shell .pill {
        align-self: center;
      }

      .controller-shell .answer-form {
        display: grid;
        gap: 0.8rem;
      }

      .mind-answer-form input {
        border-radius: 999px;
        padding-inline: 1.25rem;
      }

      .heat-answer-form input,
      .heat-answer-form select {
        border-radius: 0.2rem;
        border-color: rgba(255, 45, 167, 0.55);
      }

      .vote-card-form h3 {
        margin: 0;
        color: var(--game-accent);
        text-align: center;
        text-transform: uppercase;
      }

      .vote-card-grid {
        display: grid;
        gap: 0.65rem;
      }

      .vote-card {
        display: grid;
        min-height: 5rem;
        justify-items: start;
        border: 1px solid rgba(255, 45, 167, 0.32);
        border-radius: 0.25rem;
        padding: 0.8rem 1rem;
        background: linear-gradient(135deg, rgba(92, 22, 126, 0.75), rgba(25, 6, 42, 0.9));
        color: white;
        text-align: left;
        clip-path: polygon(0.45rem 0, 100% 0, calc(100% - 0.45rem) 100%, 0 100%);
      }

      .vote-card > span {
        color: var(--game-primary);
        font-size: 0.68rem;
        letter-spacing: 0.12em;
      }

      .vote-card[aria-pressed='true'] {
        border-color: var(--game-accent);
        background: linear-gradient(135deg, rgba(255, 181, 30, 0.92), rgba(255, 45, 167, 0.88));
        color: #150318;
        box-shadow: 0 0 1.5rem rgba(255, 45, 167, 0.45);
        transform: translateY(-2px) rotate(-0.4deg);
      }

      .controller-roster {
        width: min(34rem, 100%);
        max-height: 12rem;
        margin: 0.75rem auto 0;
        overflow: auto;
      }

      .controller-roster .mind-grid,
      .controller-roster .audience-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .player-page[data-game-id] > .content > button.secondary:last-child {
        display: flex;
        width: min(34rem, 100%);
        margin: 0.75rem auto 0;
      }

      @keyframes experience-pulse {
        50% {
          opacity: 0.5;
          transform: scale(0.75);
        }
      }

      @keyframes reactor-float {
        50% {
          transform: translateY(-0.45rem) scale(1.015);
        }
      }

      @keyframes stage-breathe {
        50% {
          filter: drop-shadow(0 1.2rem 1.6rem rgba(255, 45, 167, 0.3));
          transform: scale(1.025);
        }
      }

      @media (max-width: 1050px) {
        .experience-grid {
          grid-template-columns: minmax(12rem, 0.8fr) minmax(25rem, 2fr);
        }

        .mind-roster,
        .audience-roster,
        .jury-roster {
          grid-column: 1 / -1;
        }

        .mind-grid,
        .audience-grid,
        .jury-grid {
          grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        }
      }

      @media (max-width: 720px) {
        .page[data-game-id] {
          padding: 0.5rem;
        }

        .experience-shell {
          min-height: calc(100svh - 1rem);
        }

        .experience-grid {
          display: flex;
          min-height: auto;
          flex-direction: column;
        }

        .experience-topbar {
          min-height: 4.6rem;
          padding-inline: 0.75rem;
        }

        .experience-logo {
          width: 3.4rem;
          height: 3.4rem;
        }

        .experience-title strong {
          font-size: 1.2rem;
        }

        .experience-title .experience-eyebrow {
          font-size: 0.58rem;
        }

        .experience-live-status small {
          display: none;
        }

        .lab-room-pass,
        .heat-room-pass,
        .suspect-room-pass {
          min-height: 24rem;
        }

        .consensus-stage,
        .heat-stage,
        .suspect-stage {
          min-height: 32rem;
        }

        .experience-controls {
          position: sticky;
          right: auto;
          bottom: 0.5rem;
          width: 100%;
          margin-top: 0.8rem;
          transform: none;
        }

        .host-experience {
          padding-bottom: 0;
        }

        .display-experience .mind-roster,
        .display-experience .audience-roster,
        .display-experience .jury-roster {
          margin-bottom: 1rem;
        }

        .player-page[data-game-id] > .content {
          width: 100%;
        }

        .controller-shell {
          min-height: calc(100svh - 5rem);
        }

        .themed-join-card {
          margin: 0;
          min-height: calc(100svh - 1rem);
          align-content: center;
        }

        .themed-join-intro {
          grid-template-columns: 6rem 1fr;
        }

        .themed-join-logo {
          width: 6rem;
          height: 6rem;
        }
      }

      /* Shared-screen display mode: keep the entire experience inside the viewport. */
      .display-page[data-game-id] {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-height: 100dvh;
        min-height: 0;
        overflow: hidden;
        padding-block: max(0.45rem, env(safe-area-inset-top))
          max(0.45rem, env(safe-area-inset-bottom));
      }

      .display-page[data-game-id] > .notice {
        flex: 0 0 auto;
      }

      .display-page[data-game-id] > .content {
        min-height: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .display-page[data-game-id] .display-experience {
        --display-scale: 1;
        width: calc(100% / var(--display-scale));
        height: 100%;
        min-height: 0;
        max-height: none;
        margin-inline: auto;
        overflow: visible;
        transform: scale(var(--display-scale));
        transform-origin: top center;
      }

      .display-page[data-game-id] .display-experience .experience-grid {
        min-height: 0;
        height: calc(100% - 5.5rem);
        overflow: visible;
      }

      .display-page[data-game-id] .display-experience .consensus-stage,
      .display-page[data-game-id] .display-experience .heat-stage,
      .display-page[data-game-id] .display-experience .suspect-stage,
      .display-page[data-game-id] .display-experience .stage-copy,
      .display-page[data-game-id] .display-experience .mind-roster,
      .display-page[data-game-id] .display-experience .audience-roster,
      .display-page[data-game-id] .display-experience .jury-roster,
      .display-page[data-game-id] .display-experience .lab-room-pass,
      .display-page[data-game-id] .display-experience .heat-room-pass,
      .display-page[data-game-id] .display-experience .suspect-room-pass {
        min-height: 0;
        overflow: visible;
      }

      /* Drawn Out — shared neon-comic sketch studio. */
      .game-drawn-out {
        --game-accent: #9cf000;
        --game-accent-strong: #ff2ea6;
        --game-glow: rgba(156, 240, 0, 0.2);
        --game-surface: rgba(30, 12, 53, 0.74);
      }

      .page.game-drawn-out {
        background:
          linear-gradient(rgba(5, 3, 18, 0.28), rgba(5, 3, 18, 0.45)),
          url('/assets/drawn-out-bg-v2.png') center / cover fixed;
      }

      .page.game-drawn-out .phase-card,
      .game-detail.game-drawn-out {
        border-color: rgba(156, 240, 0, 0.62);
        background:
          linear-gradient(135deg, rgba(156, 240, 0, 0.14), transparent 48%), var(--surface);
      }

      .sketch-studio {
        border-color: rgba(156, 240, 0, 0.48);
        background: rgba(7, 3, 25, 0.72);
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.45);
      }

      .drawn-out-room-pass,
      .artist-roster,
      .drawn-out-stage {
        overflow: hidden;
        border: 2px solid rgba(156, 240, 0, 0.38);
        border-radius: 1.4rem;
        background: rgba(15, 7, 38, 0.82);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }

      .drawn-out-room-pass {
        display: grid;
        min-height: 31rem;
        align-content: center;
        justify-items: center;
        gap: 0.65rem;
        padding: 1rem;
        text-align: center;
      }

      .drawn-out-room-pass .room-code {
        color: #9cf000;
        font-size: clamp(2.8rem, 6vw, 5.6rem);
        letter-spacing: 0.12em;
        text-shadow: 0 0 1.2rem rgba(156, 240, 0, 0.42);
      }

      .drawn-out-room-pass .qr {
        width: min(12rem, 75%);
        border: 0.5rem solid white;
        border-radius: 1rem;
        background: white;
      }

      .drawn-out-stage {
        display: grid;
        min-width: 0;
        min-height: 31rem;
        grid-template-columns: minmax(14rem, 0.95fr) minmax(18rem, 1.2fr);
        align-items: center;
        gap: clamp(0.8rem, 2vw, 1.5rem);
        padding: clamp(0.9rem, 2vw, 1.5rem);
      }

      .drawn-out-canvas-stage {
        display: grid;
        min-width: 0;
        place-items: center;
      }

      .drawn-out-canvas-stage .stage-art {
        width: min(100%, 28rem);
        max-height: 48vh;
        object-fit: contain;
        filter: drop-shadow(0 1rem 1.4rem rgba(0, 0, 0, 0.44));
      }

      .drawing-canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 2;
        border: 0.45rem solid #fff;
        border-radius: 1rem;
        background: #fffdf4;
        box-shadow:
          0 1rem 2rem rgba(0, 0, 0, 0.38),
          0 0 0 0.2rem #151022;
      }

      .drawing-input {
        cursor: crosshair;
        touch-action: none;
      }

      .drawing-pad {
        display: grid;
        gap: 0.75rem;
      }

      .drawing-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
      }

      .drawing-swatch {
        width: 2.65rem;
        min-width: 2.65rem;
        height: 2.65rem;
        padding: 0;
        border: 0.18rem solid white;
        border-radius: 50%;
      }

      .drawing-swatch[aria-pressed='true'] {
        outline: 0.22rem solid #9cf000;
        outline-offset: 0.12rem;
      }

      .display-drawing {
        width: min(100%, 42rem);
      }

      .controller-drawing {
        max-width: 34rem;
      }

      .drawn-out-stage-copy {
        display: grid;
        min-width: 0;
        align-content: center;
        gap: 0.65rem;
      }

      .drawn-out-prompt-reveal,
      .drawn-out-fake-reveal,
      .drawn-out-instruction,
      .drawn-out-fake-warning {
        margin: 0;
        border-radius: 1rem;
        padding: 0.75rem 0.9rem;
        font-weight: 900;
      }

      .drawn-out-prompt-reveal {
        color: #151022;
        background: #9cf000;
      }

      .drawn-out-fake-reveal,
      .drawn-out-fake-warning {
        color: white;
        background: #ff2ea6;
      }

      .drawn-out-chain {
        display: grid;
        max-height: 20rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.55rem;
        overflow: auto;
        padding-left: 1.4rem;
      }

      .drawn-out-chain li {
        display: grid;
        gap: 0.35rem;
        border-radius: 0.75rem;
        padding: 0.55rem;
        background: rgba(255, 255, 255, 0.08);
      }

      .chain-drawing {
        border-width: 0.2rem;
      }

      .artist-roster {
        padding: 1rem;
      }

      .artist-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
        gap: 0.55rem;
        padding: 0;
        list-style: none;
      }

      .artist-grid li {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        border-radius: 0.8rem;
        padding: 0.55rem;
        background: rgba(156, 240, 0, 0.08);
      }

      .drawn-out-controller {
        border-color: rgba(156, 240, 0, 0.5);
        background: rgba(19, 7, 43, 0.92);
      }

      .drawn-out-controller > .controller-art {
        opacity: 0.24;
      }

      .join-drawn-out {
        border-color: rgba(156, 240, 0, 0.55);
        background:
          linear-gradient(rgba(9, 3, 28, 0.76), rgba(9, 3, 28, 0.88)),
          url('/assets/drawn-out-bg-v2.png') center / cover;
      }

      .join-drawn-out button:not(.secondary),
      .drawn-out-controller button:not(.secondary) {
        color: #151022;
        background: linear-gradient(135deg, #9cf000, #ffe12c);
      }

      .display-page[data-game-id] .display-experience .drawn-out-stage,
      .display-page[data-game-id] .display-experience .artist-roster,
      .display-page[data-game-id] .display-experience .drawn-out-room-pass {
        min-height: 0;
        overflow: visible;
      }

      .display-page[data-game-id] .display-experience .drawn-out-chain {
        max-height: none;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        overflow: visible;
        padding-left: 1rem;
      }

      .display-page[data-game-id] .display-experience .drawn-out-chain li {
        min-width: 0;
        padding: 0.4rem;
        font-size: 0.72rem;
      }

      @media (max-width: 720px) {
        .drawn-out-room-pass,
        .drawn-out-stage {
          min-height: 24rem;
        }

        .drawn-out-stage {
          grid-template-columns: 1fr;
        }

        .drawn-out-canvas-stage .stage-art {
          max-height: 16rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
