<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b16" />
    <meta
      name="description"
      content="Room Riot — a local party game for loud opinions and big laughs."
    />
    <title>Room Riot</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        background: #080b16;
        color: #f7f9ff;
        --ink: #080b16;
        --surface: rgba(17, 23, 41, 0.9);
        --line: rgba(152, 177, 220, 0.24);
        --text: #f7f9ff;
        --muted: #9aa7c4;
        --cyan: #26e6f2;
        --pink: #ff2ea6;
        --yellow: #ffd429;
        --green: #71f59a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--ink);
      }

      body {
        position: relative;
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 4% -5%, rgba(42, 230, 242, 0.2), transparent 28rem),
          radial-gradient(circle at 96% 7%, rgba(255, 46, 166, 0.18), transparent 27rem),
          linear-gradient(145deg, #090c18, #11152a 52%, #090b15);
        overscroll-behavior-y: none;
      }

      body::before {
        position: fixed;
        z-index: 0;
        inset: 0;
        content: '';
        pointer-events: none;
        opacity: 0.16;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 4rem 4rem;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      .button {
        display: inline-flex;
        min-height: 3.15rem;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: 1rem;
        padding: 0.8rem 1.25rem;
        background: linear-gradient(135deg, #57f5ff, var(--cyan));
        color: #06101a;
        cursor: pointer;
        font-weight: 900;
        letter-spacing: 0.03em;
        text-decoration: none;
        box-shadow: 0 0.75rem 1.8rem rgba(38, 230, 242, 0.16);
        touch-action: manipulation;
        transition:
          transform 160ms ease,
          filter 160ms ease,
          box-shadow 160ms ease;
      }

      button:hover,
      .button:hover {
        filter: brightness(1.08) saturate(1.1);
        transform: translateY(-2px);
        box-shadow: 0 1rem 2rem rgba(38, 230, 242, 0.24);
      }

      button:active,
      .button:active {
        transform: translateY(0);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      .button:focus-visible {
        outline: 3px solid var(--yellow);
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
        filter: grayscale(0.55);
        transform: none;
      }

      .secondary {
        border-color: rgba(38, 230, 242, 0.52);
        background: rgba(15, 22, 39, 0.82);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .secondary:hover {
        background: rgba(38, 230, 242, 0.12);
        box-shadow: 0 0.8rem 1.7rem rgba(38, 230, 242, 0.13);
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(1120px, 100%);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(4rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      }

      .display-page {
        width: min(1500px, 100%);
        padding-inline: clamp(1rem, 4vw, 4.5rem);
        background:
          linear-gradient(180deg, rgba(5, 9, 21, 0.1), rgba(5, 9, 21, 0.7)),
          url('/assets/room-riot-display-bg.png') center / cover fixed;
      }

      .page-header {
        position: relative;
        display: grid;
        gap: 0.45rem;
        margin-bottom: 1.4rem;
        padding: 0.5rem 0 1.2rem;
      }

      .page-header::after {
        width: min(23rem, 62vw);
        height: 0.2rem;
        margin-top: 0.7rem;
        content: '';
        background: linear-gradient(90deg, var(--cyan), var(--pink), transparent);
        box-shadow: 0 0 1rem rgba(38, 230, 242, 0.3);
      }

      .brand {
        width: min(18rem, 67vw);
      }

      .brand-logo {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0.7rem 1.15rem rgba(0, 0, 0, 0.42));
      }

      h1,
      h2,
      p {
        overflow-wrap: anywhere;
      }

      h1 {
        max-width: 18ch;
        margin: 0.2rem 0;
        color: var(--text);
        font-size: clamp(2.1rem, 7vw, 4.7rem);
        line-height: 0.96;
        letter-spacing: -0.055em;
        text-wrap: balance;
        text-shadow: 0 0.35rem 1.4rem rgba(0, 0, 0, 0.35);
      }

      h2 {
        margin: 0 0 0.9rem;
        font-size: clamp(1.15rem, 2vw, 1.55rem);
        letter-spacing: -0.025em;
      }

      .muted {
        color: var(--muted);
      }

      .page-header > .muted {
        max-width: 48rem;
        margin: 0;
        color: #b4bfd6;
        font-size: clamp(0.95rem, 2vw, 1.1rem);
      }

      .notice {
        min-height: 1.4rem;
        margin: 0 0 0.9rem;
        color: var(--cyan);
        font-size: 0.9rem;
        font-weight: 800;
      }

      .notice.error {
        color: #ff92b9;
      }

      .content {
        display: grid;
        gap: 1rem;
      }

      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 1.4rem;
        padding: clamp(1rem, 2.5vw, 1.5rem);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.045), transparent 38%), var(--surface);
        box-shadow:
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.23),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(14px);
      }

      .card::after {
        position: absolute;
        top: -5rem;
        right: -4rem;
        width: 12rem;
        height: 12rem;
        border-radius: 50%;
        content: '';
        background: rgba(38, 230, 242, 0.06);
        filter: blur(1rem);
        pointer-events: none;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .phase-card {
        animation: phase-in 240ms ease-out both;
      }

      .phase-lobby {
        border-color: rgba(38, 230, 242, 0.45);
      }

      .phase-input {
        border-color: rgba(38, 230, 242, 0.65);
        box-shadow:
          0 0 2.2rem rgba(38, 230, 242, 0.1),
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.23);
      }

      .phase-voting {
        border-color: rgba(255, 46, 166, 0.72);
        box-shadow:
          0 0 2.2rem rgba(255, 46, 166, 0.1),
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.23);
      }

      .phase-results,
      .phase-winner {
        border-color: rgba(255, 212, 41, 0.7);
        box-shadow:
          0 0 2.2rem rgba(255, 212, 41, 0.1),
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.23);
      }

      @keyframes phase-in {
        from {
          opacity: 0;
          transform: translateY(0.5rem) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .form {
        display: grid;
        gap: 1rem;
        max-width: 38rem;
      }

      .field {
        display: grid;
        gap: 0.45rem;
        color: #c3cde1;
        font-size: 0.86rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      input,
      select {
        width: 100%;
        min-height: 3.15rem;
        border: 1px solid rgba(152, 177, 220, 0.35);
        border-radius: 0.9rem;
        padding: 0.8rem 0.95rem;
        background: rgba(5, 10, 23, 0.75);
        color: var(--text);
        outline: none;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      input:hover,
      select:hover,
      input:focus,
      select:focus {
        border-color: rgba(38, 230, 242, 0.78);
        background: rgba(7, 16, 32, 0.92);
        box-shadow: 0 0 0 3px rgba(38, 230, 242, 0.1);
      }

      input::placeholder {
        color: #6e7b99;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        align-items: center;
      }

      .room-details {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.8rem 1.25rem;
        align-items: center;
        background:
          linear-gradient(135deg, rgba(38, 230, 242, 0.12), transparent 48%), var(--surface);
      }

      .room-details .room-code {
        grid-column: 1;
        grid-row: 1;
      }

      .room-details .qr {
        grid-column: 2;
        grid-row: 1 / span 2;
      }

      .room-details p {
        grid-column: 1;
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .room-code {
        display: block;
        color: var(--yellow);
        font-size: clamp(3.2rem, 12vw, 8rem);
        font-weight: 950;
        letter-spacing: 0.11em;
        line-height: 0.9;
        text-shadow:
          0 0 1.6rem rgba(255, 212, 41, 0.25),
          0.12rem 0.16rem 0 #7f5300;
      }

      .qr {
        width: min(13rem, 30vw);
        border: 0.45rem solid #fff;
        border-radius: 1rem;
        background: #fff;
        padding: 0.35rem;
        box-shadow: 0 0.9rem 2rem rgba(0, 0, 0, 0.3);
      }

      .prompt {
        margin: 0.8rem 0 1.1rem;
        color: var(--text);
        font-size: clamp(1.6rem, 4.2vw, 3.9rem);
        font-weight: 950;
        line-height: 1.04;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }

      .answer-form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.1rem;
      }

      .answer-form .field {
        flex: 1 1 18rem;
      }

      .answer-form input,
      .answer-form select {
        min-height: 3.5rem;
      }

      .answer-form button {
        align-self: end;
      }

      .player-list,
      .answer-list {
        display: grid;
        gap: 0.55rem;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .player-list li,
      .answer-list li {
        display: flex;
        min-height: 3rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border: 1px solid rgba(152, 177, 220, 0.13);
        border-radius: 0.9rem;
        padding: 0.7rem 0.85rem;
        background: rgba(4, 9, 22, 0.45);
      }

      .answer-list li {
        align-items: flex-start;
      }

      .answer-list li > span:first-child {
        font-weight: 800;
      }

      .connected {
        color: var(--green);
        font-weight: 900;
      }

      .pill {
        display: inline-flex;
        min-height: 2rem;
        align-items: center;
        border: 1px solid rgba(38, 230, 242, 0.4);
        border-radius: 999px;
        padding: 0.4rem 0.8rem;
        background: rgba(38, 230, 242, 0.11);
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.06em;
      }

      .scoreboard li strong {
        color: var(--yellow);
        font-size: 1.25rem;
      }

      .center {
        text-align: center;
        justify-items: center;
      }

      .center .qr {
        width: min(16rem, 60vw);
      }

      .display-page .page-header {
        max-width: 58rem;
        margin-inline: auto;
        text-align: center;
        justify-items: center;
      }

      .display-page .page-header::after {
        background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
      }

      .display-page .brand {
        width: min(23rem, 60vw);
      }

      .display-page .content {
        grid-template-columns: minmax(0, 1.35fr) minmax(18rem, 0.65fr);
        align-items: start;
      }

      .display-page .content > :first-child,
      .display-page .content > :nth-child(2) {
        grid-column: 1;
      }

      .display-page .content > :last-child {
        grid-column: 2;
        grid-row: 1 / span 2;
      }

      .display-page .content > .phase-card:first-child {
        min-height: 31rem;
        display: grid;
        align-content: center;
      }

      .display-page .prompt {
        font-size: clamp(2.1rem, 5vw, 5.5rem);
      }

      .display-page .player-list {
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      }

      @media (min-width: 720px) {
        .room-details .room-code {
          font-size: clamp(4.2rem, 10vw, 7rem);
        }
      }

      @media (max-width: 900px) {
        .display-page .content {
          grid-template-columns: 1fr;
        }

        .display-page .content > :first-child,
        .display-page .content > :nth-child(2),
        .display-page .content > :last-child {
          grid-column: 1;
          grid-row: auto;
        }
      }

      @media (max-width: 600px) {
        .page {
          padding-top: max(1rem, env(safe-area-inset-top));
        }

        .page-header {
          margin-bottom: 1rem;
        }

        .brand {
          width: min(13rem, 70vw);
        }

        .room-details {
          grid-template-columns: 1fr;
        }

        .room-details .room-code,
        .room-details .qr,
        .room-details p {
          grid-column: 1;
          grid-row: auto;
        }

        .room-details .qr {
          width: min(13rem, 65vw);
        }

        .actions > button,
        .actions > .button {
          flex: 1 1 100%;
          text-align: center;
        }

        .answer-form {
          flex-direction: column;
        }

        .answer-form button {
          width: 100%;
        }

        .player-list li,
        .answer-list li {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.3rem;
        }

        .display-page .content > .phase-card:first-child {
          min-height: 25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
